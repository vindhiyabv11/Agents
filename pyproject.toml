[project]
name = "schemaguard-agent"
version = "0.1.0"
description = "Structured output agent: Pydantic schema enforcement, tool validation, retries, failure logging"
readme = "README.md"
authors = [
    {name = "Vindhiya"}
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "openai",
    "pydantic",
    "python-dotenv",
    "streamlit",
]

[project.scripts]
schemaguard = "schemaguard.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemaguard"]
